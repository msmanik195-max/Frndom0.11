name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Project and Gradle Wrapper
        id: locate-project
        run: |
          echo "Locating Android project root and gradlew..."
          PROJECT_ROOT=""
          if [ -f "gradlew" ]; then
            PROJECT_ROOT="."
          elif [ -f "android/gradlew" ]; then
            PROJECT_ROOT="android"
          elif [ -f "android-app/gradlew" ]; then
            PROJECT_ROOT="android-app"
          else
            GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*/*" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
            fi
          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in the repository."
            exit 1
          fi

          echo "Found Android project at: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Application module directory 'app' not found at '$PROJECT_ROOT/app'."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: |
          PROJECT_ROOT="${{ steps.locate-project.outputs.project_root }}"
          chmod +x "$PROJECT_ROOT/gradlew"

      - name: Clean stale Gradle and build caches
        run: |
          PROJECT_ROOT="${{ steps.locate-project.outputs.project_root }}"
          echo "Cleaning stale project caches..."
          rm -rf "$PROJECT_ROOT/.gradle"
          rm -rf "$PROJECT_ROOT/app/build"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT="${{ steps.locate-project.outputs.project_root }}"
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: find-apk
        run: |
          PROJECT_ROOT="${{ steps.locate-project.outputs.project_root }}"
          echo "Searching for generated debug APK files..."

          APK_PATHS=$(find "$PROJECT_ROOT/app/build/outputs/apk" -name "*.apk" -type f 2>/dev/null || true)

          if [ -z "$APK_PATHS" ]; then
            APK_PATHS=$(find "$PROJECT_ROOT" -name "*.apk" -type f -not -path "*/.*/*" 2>/dev/null || true)
          fi

          if [ -z "$APK_PATHS" ]; then
            echo "::error::No debug APK file was generated by the build."
            exit 1
          fi

          echo "Generated APK file(s) found:"
          echo "$APK_PATHS"

          FIRST_APK=$(echo "$APK_PATHS" | head -n 1)
          echo "apk_path=$FIRST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
